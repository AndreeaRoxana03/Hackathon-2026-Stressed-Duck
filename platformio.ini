; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-cores3

[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino

; Serial monitor / upload
monitor_speed = 115200
upload_speed = 1500000

lib_deps =
    m5stack/M5Unified @ ^0.1.17
    m5stack/M5GFX @ ^0.1.17

; Spoken clips rendered by tools/speech_to_clips.py
board_build.embed_files = src/generated/speech_clips.bin

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Desktop preview via SDL (needs MSYS2 mingw64 gcc + SDL2 on PATH). Run: python -m platformio run -e native -t exec
[env:native]
platform = native
lib_deps =
    m5stack/M5Unified @ ^0.1.17
    m5stack/M5GFX @ ^0.1.17
build_type = release
build_src_filter = +<*> +<../sim/>
build_flags =
    -O1 -xc++ -std=gnu++17
    -DNATIVE_BUILD
    -DM5GFX_BOARD=board_M5StackCoreS3
    -Isim
    -DM5GFX_SCALE=2
    -DM5GFX_ROTATION=0
    -IC:/msys64/mingw64/include/SDL2
    -LC:/msys64/mingw64/lib
    -lSDL2
